version: 2

models:
  - name: stg_btc
    description: "Staging table for BTC data"
    columns:
      - name: HASHKEY
        tests:
          - not_null
          - unique
  
  - name: stg_btc_outputs
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('stg_btc_outputs_py')

  - name: whale_alert
    latest_version: 2
    config:
      contract:
        enforced: true
    columns:
      - name: INVOCATION_ID
        data_type: string
      - name: output_address
        data_type: string
        tests:
          - assert_valid_btc_address
      - name: total_sent
        data_type: float
      - name: tx_count
        data_type: int
      - name: total_sent_usd
        data_type: float
    
    versions: 
      - v: 1
        deprecation_date: 2027-01-01
        config:
          enabled: false
      - v: 2
        columns: 
        - include: all
          exclude: [total_sent_usd]

exposures:

  - name: btc_whale_alert_exposure
    label: BTC Whale Alert
    type: dashboard
    maturity: high
    url: https://lookerstudio.google.com/reporting/822f472c-5a18-4f5a-80ac-b6583842f1fd
    description: >
      BTC Whale alert transactions report?

    depends_on:
      - ref('whale_alert', v=2)

    owner:
      name: Smit Rajani